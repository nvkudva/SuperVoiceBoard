# SuperVoiceBoard: on-demand release build. The signing keystore lives outside
# the repo, so the APK produced here is unsigned — see app/build.gradle.kts.
name: Release build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Assemble release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: APK size
        run: ls -l app/build/outputs/apk/release/*.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: supervoiceboard-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-reports
          path: app/build/reports/
