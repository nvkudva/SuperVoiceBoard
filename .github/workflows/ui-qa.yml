# SuperVoiceBoard: UI QA on a real emulator. Covers the settings surface and the
# keyboard's own flows, which no JVM/Robolectric test can reach.
name: UI QA

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]

concurrency:
  group: ui-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-qa:
    name: Instrumented UI flows (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest runners expose /dev/kvm but not to the runner user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assemble app + test APKs
        run: ./gradlew :app:assembleDebugNoMinify :app:assembleDebugNoMinifyAndroidTest --no-daemon

      - name: Run UI QA suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # adb only exists on PATH inside this action, so the screenshots are
          # pulled here rather than in a later step.
          script: |
            adb shell settings put secure long_press_timeout 1500
            ./gradlew :app:connectedDebugNoMinifyAndroidTest --no-daemon || FAILED=1
            mkdir -p ui-qa-screenshots
            adb pull /sdcard/Android/data/com.supervoiceboard.app.debug/files/ui-qa ui-qa-screenshots || true
            exit ${FAILED:-0}

      - name: Upload UI QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-qa-reports-api${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ui-qa-screenshots/
