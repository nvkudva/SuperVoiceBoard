# WaveKey: the JDK Gradle itself runs on. 21 is the newest LTS the Android
# toolchain supports, and the one CI already uses; the bytecode target stays at
# 17, which is what AGP and D8 accept.
#
# Written by hand rather than by `updateDaemonJvm`, which insists on toolchain
# download URLs for every platform. The foojay resolver in settings.gradle
# fetches a matching JDK on a machine that has none.
toolchainVersion=21
