# SuperVoiceBoard: the build to sideload. Debug-signed and arm64 only, which is
# what a current phone needs — switch back to release when a production build
# is actually wanted.
name: Phone build (debug)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/**"]

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Assemble debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: APK size
        run: |
          for f in app/build/outputs/apk/debug/*arm64-v8a*.apk; do
            echo "::notice title=Artifact size::$(basename "$f") $(stat -c%s "$f") bytes"
          done
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: supervoiceboard-apk
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-reports
          path: app/build/reports/
